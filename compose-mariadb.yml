services:

  dgenies-front:
    build:
      context: .
      target: dgenies
    environment:
      - MAIL_SERVER=smtp
      - MAIL_PORT=25
      - CONFIG_DIR=/dgenies
      - DATA_DIR=/dgenies/data
      - UPLOAD_DIR=/tmp/dgenies
      - DATABASE_URL=db
      - DATABASE_TYPE=mysql
      - DATABASE_USER=dgenies
      - DATABASE_PASSWORD=dgenies
      - DATABASE_BASE=dgenies
    user: "${USER_ID}:${GROUP_ID}"
    ports:
      - "5000:5000"
    volumes:
      - ./src/:/app/:ro
      - dgenies-data:/dgenies
      - dgenies-upload:/tmp/dgenies
    command: [ "wait-for-it", "db:3306", "--", "/app/bin/dgenies", "run", "--debug", "--mode", "webserver", "--no-cron", "-p", "5000", "--no-browser", "-o", "0.0.0.0" ]

  dgenies-scheduler:
    build:
      context: .
      target: dgenies
    environment:
      - WEB_URL=http://dgenies-front:5000
      - CONFIG_DIR=/dgenies
      - DATA_DIR=/dgenies/data
      - UPLOAD_DIR=/tmp/dgenies
      - DATABASE_URL=db
      - DATABASE_TYPE=mysql
      - DATABASE_USER=dgenies
      - DATABASE_PASSWORD=dgenies
      - DATABASE_BASE=dgenies
    user: "${USER_ID}:${GROUP_ID}"
    volumes:
      - ./src/:/app/:ro*
      - dgenies-data:/dgenies
      - dgenies-upload:/tmp/dgenies
    command: [ "wait-for-it", "db:3306", "--", "/app/dgenies/bin/local_scheduler.py", "-d"]

  smtp:
    image: rnwood/smtp4dev
    expose:
      - 25
    ports:
      - "5080:80"
      - "2525:25"

  db:
    image: mariadb
    environment:
      - MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1
      - MARIADB_USER=dgenies
      - MARIADB_PASSWORD=dgenies
      - MARIADB_DATABASE=dgenies
    expose:
      - 3306
    ports:
      - 3306:3306

volumes:
  dgenies-data:
  dgenies-upload: